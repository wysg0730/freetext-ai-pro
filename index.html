<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeText AI 专业版</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#18202b;font-family:system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}h1{font-size:25px}.card{background:white;border:1px solid #e2e6ed;border-radius:16px;padding:18px;margin:14px 0}button{border:0;border-radius:10px;background:#245bdb;color:white;padding:12px 16px;font-size:15px;margin:5px 5px 5px 0}button:disabled{opacity:.45}input[type=text]{width:100%;padding:12px;border:1px solid #ccd2dc;border-radius:9px;font-size:16px;margin:8px 0}#stage{background:#edf0f5;min-height:200px;display:grid;place-items:center;border-radius:10px;overflow:hidden}canvas{max-width:100%;height:auto;touch-action:none}#status{background:#f2f4f7;padding:12px;border-radius:9px;white-space:pre-wrap;color:#475467}.muted{font-size:13px;color:#667085;line-height:1.6}
</style><main class="wrap"><h1>✨ FreeText AI 专业版</h1>
<section class="card"><b>1. 上传图片</b><p><input id="file" type="file" accept="image/png,image/jpeg,image/webp"></p><div id="stage"><span id="hint">上传后，在图片上拖动框选要修改的文字</span><canvas id="c" hidden></canvas></div><p class="muted">支持 PNG、JPG、WEBP。请只编辑你有权修改的图片。</p></section>
<section class="card"><b>2. 框选区域并输入新文字</b><input id="newtext" type="text" placeholder="输入替换后的文字"><input id="extra" type="text" placeholder="可选：字体、颜色或背景要求"><button id="ocr" disabled>尝试 OCR 识别</button><button id="clear" disabled>清除选区</button><button id="edit" disabled>AI 修复并替换</button><div id="status">请先上传图片。</div></section>
<section class="card"><b>3. 下载结果</b><p><button id="download" disabled>下载高清 PNG</button></p><p class="muted">AI 会尽量保留选区外内容并匹配原图风格，字体和细节可能有差异。AI 编辑接口会产生 OpenAI API 费用，Cloudflare 免费部署不代表 API 免费。</p></section></main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
const $=id=>document.getElementById(id),c=$('c'),x=c.getContext('2d');let img=null,sel=null,start=null,out=null;
function msg(t){$('status').textContent=t}function redraw(){if(!img)return;x.clearRect(0,0,c.width,c.height);x.drawImage(img,0,0);if(sel){x.fillStyle='rgba(37,99,235,.13)';x.fillRect(sel.x,sel.y,sel.w,sel.h);x.strokeStyle='#2563eb';x.lineWidth=Math.max(2,c.width/500);x.setLineDash([8,5]);x.strokeRect(sel.x,sel.y,sel.w,sel.h)}}
$('file').onchange=()=>{let f=$('file').files[0];if(!f)return;let u=URL.createObjectURL(f),im=new Image();im.onload=()=>{img=im;c.width=im.naturalWidth;c.height=im.naturalHeight;c.hidden=false;$('hint').hidden=true;sel=null;out=null;redraw();['ocr','clear','edit'].forEach(i=>$(i).disabled=false);$('download').disabled=true;msg('图片已载入。请在图片上拖动框选要替换的文字区域。')};im.src=u};
function pos(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}
c.onpointerdown=e=>{if(!img)return;c.setPointerCapture(e.pointerId);start=pos(e);sel={x:start.x,y:start.y,w:1,h:1};redraw()};
c.onpointermove=e=>{if(!start)return;let p=pos(e);sel={x:Math.min(start.x,p.x),y:Math.min(start.y,p.y),w:Math.abs(p.x-start.x),h:Math.abs(p.y-start.y)};redraw()};
c.onpointerup=()=>{start=null;if(sel&&(sel.w<5||sel.h<5)){sel=null;redraw()}else msg('选区已设置。填写新文字后点击 AI 修复并替换。')};
$('clear').onclick=()=>{sel=null;redraw();msg('已清除选区。')};
$('ocr').onclick=async()=>{msg('正在识别，请稍候…');try{let w=await Tesseract.createWorker('chi_sim+eng');let r=await w.recognize(c);await w.terminate();msg('识别结果：\n'+(r.data.text||'没有识别到文字')+'\n请手动框选需要修改的区域。')}catch(e){msg('OCR 失败：'+e.message)}};
$('edit').onclick=async()=>{let t=$('newtext').value.trim();if(!sel||!t){msg('请先框选文字区域并填写新文字。');return}msg('正在调用 AI 编辑，请稍候…');$('edit').disabled=true;try{let a=await new Promise(r=>c.toBlob(r,'image/png'));let m=document.createElement('canvas');m.width=c.width;m.height=c.height;let q=m.getContext('2d');q.fillStyle='rgba(0,0,0,1)';q.fillRect(0,0,m.width,m.height);q.clearRect(sel.x,sel.y,sel.w,sel.h);let b=await new Promise(r=>m.toBlob(r,'image/png'));let fd=new FormData();fd.append('image',a,'source.png');fd.append('mask',b,'mask.png');fd.append('prompt',`只修改蒙版透明区域，把该区域原有文字替换成“${t}”。${$('extra').value||'尽量匹配原图字体、颜色、字号、排版，并自然修复文字背景。'}蒙版以外内容保持不变。`);let res=await fetch('/api/edit',{method:'POST',body:fd});let d=await res.json();if(!res.ok)throw Error(d.error||'请求失败');out='data:image/png;base64,'+d.image;let z=new Image();z.onload=()=>{c.width=z.naturalWidth;c.height=z.naturalHeight;x.drawImage(z,0,0);sel=null;$('download').disabled=false;msg('修改完成，可以下载 PNG。')};z.src=out}catch(e){msg('修改失败：'+e.message+'\n请确认 Cloudflare 已设置 OPENAI_API_KEY，且 API 账户有可用额度。')}finally{$('edit').disabled=false}};
$('download').onclick=()=>{if(!out)return;let a=document.createElement('a');a.href=out;a.download='freetext-ai-edited.png';a.click()};
</script></html>
